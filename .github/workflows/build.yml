name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q dock.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd proj && gradle assembleDebug --no-daemon
      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk DockHome.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" DockHome.apk --title "Dock Home build ${{ github.run_number }}" --notes "Install this APK on the Fire TV"
